<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorteador & Gerador de Números</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .num-ball { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Barra de Topo -->
  <header class="border-b border-slate-200 dark:border-zinc-800/80 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-lg shadow-blue-600/25">
          🎲
        </div>
        <div>
          <h1 class="font-bold text-base tracking-tight leading-none">Sorteador Digital</h1>
          <span class="text-xs text-slate-500 dark:text-zinc-400">Gerador rápido de números e combinações</span>
        </div>
      </div>

      <button id="themeToggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-zinc-800 hover:bg-slate-100 dark:hover:bg-zinc-900 transition" title="Alternar tema claro/escuro">
        <span id="themeIcon">☀️</span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8 md:py-12">
    <div class="bg-white dark:bg-zinc-900/90 border border-slate-200 dark:border-zinc-800 rounded-2xl p-6 md:p-8 shadow-xl shadow-slate-200/40 dark:shadow-none">
      
      <!-- Atalhos Rápidos (Presets) -->
      <div class="mb-6">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-zinc-500 block mb-2.5">Atalhos Rápidos</span>
        <div class="flex flex-wrap gap-2">
          <button onclick="applyPreset(6, 1, 60, true)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 transition">
            🍀 Mega-Sena (6 de 1 a 60)
          </button>
          <button onclick="applyPreset(15, 1, 25, true)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20 hover:bg-purple-500/20 transition">
            🎯 Lotofácil (15 de 1 a 25)
          </button>
          <button onclick="applyPreset(1, 1, 100, true)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20 hover:bg-blue-500/20 transition">
            🎟️ Rifa (1 de 1 a 100)
          </button>
        </div>
      </div>

      <!-- Controles do Sorteio -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-zinc-400 mb-1.5">Quantidade de números</label>
          <input id="qtyInput" type="number" min="1" max="100" value="6" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-zinc-400 mb-1.5">Número Mínimo</label>
          <input id="minInput" type="number" value="1" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-zinc-400 mb-1.5">Número Máximo</label>
          <input id="maxInput" type="number" value="60" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <!-- Opções Extras -->
      <div class="flex flex-wrap items-center gap-6 mb-6 text-sm text-slate-600 dark:text-zinc-300">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input id="noRepeatInput" type="checkbox" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500" />
          <span>Não repetir números</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input id="sortOrderInput" type="checkbox" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500" />
          <span>Ordenar em ordem crescente</span>
        </label>
      </div>

      <!-- Botões de Ação -->
      <div class="flex flex-wrap gap-3 mb-8">
        <button onclick="generateNumbers()" class="flex-1 min-w-[180px] py-3 px-5 rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2">
          <span>⚡ Sortear Agora</span>
        </button>
        <button onclick="copyResult()" id="copyBtn" class="py-3 px-4 rounded-xl border border-slate-200 dark:border-zinc-800 hover:bg-slate-100 dark:hover:bg-zinc-800 font-medium text-sm transition flex items-center gap-2">
          <span>📋 Copiar</span>
        </button>
      </div>

      <!-- Mensagem de Erro (se houver) -->
      <p id="errorMsg" class="hidden text-sm text-red-500 bg-red-500/10 border border-red-500/20 rounded-xl p-3 mb-6"></p>

      <!-- Área do Resultado -->
      <div class="bg-slate-50 dark:bg-zinc-950/90 border border-slate-200/80 dark:border-zinc-800/80 rounded-2xl p-6 text-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-zinc-500 block mb-4">Resultado do Sorteio</span>
        
        <div id="resultContainer" class="flex flex-wrap items-center justify-center gap-3 min-h-[64px]">
          <!-- Bolas geradas via JS -->
        </div>

        <!-- Estatísticas Rápidas -->
        <div id="statsBar" class="mt-6 pt-4 border-t border-slate-200/70 dark:border-zinc-800/70 flex flex-wrap justify-center gap-6 text-xs text-slate-500 dark:text-zinc-400">
          <span>Soma: <strong id="statSum" class="text-slate-800 dark:text-zinc-200">0</strong></span>
          <span>Pares: <strong id="statEven" class="text-slate-800 dark:text-zinc-200">0</strong></span>
          <span>Ímpares: <strong id="statOdd" class="text-slate-800 dark:text-zinc-200">0</strong></span>
        </div>
      </div>

      <!-- Histórico Recente -->
      <div id="historySection" class="mt-8 pt-6 border-t border-slate-200 dark:border-zinc-800 hidden">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-zinc-500">Últimos Sorteios</h2>
          <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-500 transition">Limpar histórico</button>
        </div>
        <div id="historyList" class="space-y-2 max-h-48 overflow-y-auto pr-1 text-sm font-mono"></div>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-400 dark:text-zinc-600">
    Sorteador online rápido • Hospedado na Vercel
  </footer>

  <script>
    let currentNumbers = [];
    let history = [];

    // Alternar Tema Claro/Escuro
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
    });

    // Aplicar Atalhos
    function applyPreset(qty, min, max, noRepeat) {
      document.getElementById('qtyInput').value = qty;
      document.getElementById('minInput').value = min;
      document.getElementById('maxInput').value = max;
      document.getElementById('noRepeatInput').checked = noRepeat;
      generateNumbers();
    }

    // Função Principal de Sorteio
    function generateNumbers() {
      const qty = parseInt(document.getElementById('qtyInput').value, 10);
      const min = parseInt(document.getElementById('minInput').value, 10);
      const max = parseInt(document.getElementById('maxInput').value, 10);
      const noRepeat = document.getElementById('noRepeatInput').checked;
      const sortOrder = document.getElementById('sortOrderInput').checked;
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.classList.add('hidden');

      if (isNaN(qty) || isNaN(min) || isNaN(max) || qty < 1) {
        showError('Preencha todos os campos com números válidos.');
        return;
      }
      if (min > max) {
        showError('O número mínimo não pode ser maior que o número máximo.');
        return;
      }
      const totalAvailable = max - min + 1;
      if (noRepeat && qty > totalAvailable) {
        showError(`Não é possível sortear ${qty} números sem repetição entre ${min} e ${max}.`);
        return;
      }

      const results = [];
      const used = new Set();

      while (results.length < qty) {
        const rand = Math.floor(Math.random() * (max - min + 1)) + min;
        if (noRepeat) {
          if (!used.has(rand)) {
            used.add(rand);
            results.push(rand);
          }
        } else {
          results.push(rand);
        }
      }

      if (sortOrder) {
        results.sort((a, b) => a - b);
      }

      currentNumbers = results;
      renderResult(results);
      addToHistory(results);
    }

    function showError(msg) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
    }

    function renderResult(numbers) {
      const container = document.getElementById('resultContainer');
      container.innerHTML = '';

      numbers.forEach((num, idx) => {
        const ball = document.createElement('div');
        ball.className = 'num-ball w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-blue-600 text-white font-mono font-bold text-lg sm:text-xl flex items-center justify-center shadow-md shadow-blue-600/20';
        ball.style.animationDelay = `${idx * 35}ms`;
        ball.textContent = String(num).padStart(2, '0');
        container.appendChild(ball);
      });

      // Atualiza Estatísticas
      const sum = numbers.reduce((acc, n) => acc + n, 0);
      const even = numbers.filter(n => n % 2 === 0).length;
      const odd = numbers.length - even;

      document.getElementById('statSum').textContent = sum;
      document.getElementById('statEven').textContent = even;
      document.getElementById('statOdd').textContent = odd;
    }

    function addToHistory(numbers) {
      const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const formatted = numbers.map(n => String(n).padStart(2, '0')).join(' - ');
      history.unshift({ time, formatted });
      if (history.length > 10) history.pop();

      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');
      section.classList.remove('hidden');

      list.innerHTML = history.map(item => `
        <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-slate-50 dark:bg-zinc-950 border border-slate-200/60 dark:border-zinc-800/60">
          <span class="font-semibold text-blue-600 dark:text-blue-400">${item.formatted}</span>
          <span class="text-xs text-slate-400 dark:text-zinc-500">${item.time}</span>
        </div>
      `).join('');
    }

    function clearHistory() {
      history = [];
      document.getElementById('historySection').classList.add('hidden');
    }

    function copyResult() {
      if (!currentNumbers.length) return;
      const text = currentNumbers.map(n => String(n).padStart(2, '0')).join(' - ');
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      const original = btn.innerHTML;
      btn.innerHTML = '<span>✅ Copiado!</span>';
      setTimeout(() => { btn.innerHTML = original; }, 1800);
    }

    // Faz um sorteio inicial ao abrir a página
    generateNumbers();
  </script>
</body>
</html>
